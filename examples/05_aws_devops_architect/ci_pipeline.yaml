name: Java CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./gradlew test build

      - name: Package image
        run: docker build -t my-registry/order-service:${{ github.sha }} .

      - name: Deploy to cluster
        run: echo "Deploy to Kubernetes or ECS from here"
